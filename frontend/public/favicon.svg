<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="dm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer rounded background -->
  <rect width="32" height="32" rx="8" fill="#070b14" />
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#dm-grad)" />
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#070b14" fill-opacity="0.25" />

  <!-- Crisp checkmark -->
  <path
    d="M9 16.5 L14 21.5 L23 11"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
