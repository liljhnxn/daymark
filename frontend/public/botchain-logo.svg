<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="botchainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Outer Hexagon Ring -->
  <polygon points="50,6 88,27 88,73 50,94 12,73 12,27" stroke="url(#botchainGrad)" stroke-width="4" fill="#0A0F1D" rx="4" />
  <!-- Node Connector Lines -->
  <line x1="50" y1="26" x2="30" y2="46" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <line x1="50" y1="26" x2="70" y2="46" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <line x1="30" y1="46" x2="50" y2="68" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <line x1="70" y1="46" x2="50" y2="68" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <line x1="30" y1="46" x2="70" y2="46" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="2 3" opacity="0.6" />
  <!-- Central Core Node -->
  <circle cx="50" cy="46" r="8" fill="url(#botchainGrad)" />
  <circle cx="50" cy="46" r="4" fill="#FFFFFF" />
  <!-- Satellite Nodes -->
  <circle cx="50" cy="26" r="4.5" fill="#06B6D4" />
  <circle cx="30" cy="46" r="4.5" fill="#3B82F6" />
  <circle cx="70" cy="46" r="4.5" fill="#8B5CF6" />
  <circle cx="50" cy="68" r="4.5" fill="#06B6D4" />
  <!-- Subtle BOT Brand Text -->
  <text x="50" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" fill="#06B6D4" text-anchor="middle" letter-spacing="2">BOT CHAIN</text>
</svg>

